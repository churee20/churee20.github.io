<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자 실적 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic', Arial, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
.header { background: linear-gradient(135deg, #161b22, #1f2937); padding: 20px 32px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 20px; font-weight: 700; color: #e6edf3; }
.header .meta { font-size: 11px; color: #8b949e; margin-top: 3px; }
.header .total-rate { font-size: 28px; font-weight: 800; color: #3fb950; }
.header .rate-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 20px 32px 8px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; text-align: center; }
.card .label { font-size: 10px; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.card .value { font-size: 22px; font-weight: 700; }
.card .sub { font-size: 10px; color: #6e7681; margin-top: 4px; }
.card.blue .value { color: #58a6ff; }
.card.yellow .value { color: #e3b341; }
.card.green .value { color: #3fb950; }
.tabs { display: flex; gap: 0; padding: 14px 32px 0; border-bottom: 1px solid #30363d; }
.tab-btn { padding: 10px 20px; font-size: 13px; cursor: pointer; color: #8b949e; background: none; border: none; border-bottom: 2px solid transparent; transition: all 0.2s; font-family: inherit; }
.tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; font-weight: 600; }
.tab-btn:hover:not(.active) { color: #e6edf3; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.chart-grid-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 14px; padding: 16px 32px; }
.chart-grid-full { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 16px 32px; }
.chart-grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px 32px; }
.chart-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 18px; }
.chart-card h3 { font-size: 12px; color: #8b949e; margin-bottom: 14px; font-weight: 600; }
.chart-wrap { position: relative; width: 100%; }
.stat-chips { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.chip { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 8px 14px; font-size: 11px; }
.chip .cl { color: #6e7681; font-size: 9px; display: block; margin-bottom: 2px; }
.chip .cv { font-weight: 700; }
.table-section { padding: 0 32px 28px; }
.table-section h3 { font-size: 12px; color: #8b949e; margin-bottom: 10px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; }
th { background: #21262d; padding: 9px 12px; text-align: right; font-size: 10px; color: #8b949e; font-weight: 600; border-bottom: 1px solid #30363d; }
th:first-child, th:nth-child(2) { text-align: left; }
td { padding: 9px 12px; font-size: 11px; border-top: 1px solid #21262d; text-align: right; color: #e6edf3; }
td:first-child, td:nth-child(2) { text-align: left; color: #c9d1d9; }
tr.subtotal td { background: #1c2128; font-weight: 700; color: #58a6ff; }
tr.total-row td { background: #1a2332; font-weight: 700; color: #3fb950; font-size: 12px; }
.pos { color: #3fb950; }
.neg { color: #f85149; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📊 투자 실적 대시보드</h1>
    <div class="meta">기준: 2026-06-15 16:00 &nbsp;|&nbsp; Google Sheets 실시간</div>
  </div>
  <div style="text-align:right">
    <div class="rate-label">전체 수익률</div>
    <div class="total-rate">+215.79%</div>
  </div>
</div>
<div class="cards">
  <div class="card blue"><div class="label">총 투자원금</div><div class="value">₩8.6억</div><div class="sub">₩855,553,789</div></div>
  <div class="card yellow"><div class="label">총 현재금액</div><div class="value">₩10.1억</div><div class="sub">₩1,006,915,867</div></div>
  <div class="card green"><div class="label">총 수익금액</div><div class="value">+₩6.9억</div><div class="sub">₩688,059,451</div></div>
  <div class="card green"><div class="label">전일대비 (vs 6/12)</div><div class="value">+₩0.1억</div><div class="sub">+₩8,466,603 (+0.85%)</div></div>
</div>
